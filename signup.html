<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hari Om Silver House - Sign Up</title>
    <!-- Favicon -->
    <link href="img/hero.png" rel="icon">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css" integrity="sha512-YWzhKL2whUzgiheMoBFwW8CKV4qpHQAEuvilg9FAn5VJUDwKZZxkJNuGM4XkWuk94WCrrwslk8yWNGmY1EduTA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="login-div">
        <div class="logo">
            <a href="index.html">
                <img src="img/hero.png" alt="Hari Om Silver House">
            </a>
        </div>
        <div class="title">SIGN UP</div>
        <div class="sub-title">MADE BEAUTIFUL CONNECTION !</div>
        
        <!-- Auth status alert message -->
        <div id="auth-alert" class="auth-alert" role="alert"></div>

        <div class="fields">
            <div class="username">
                <i class="fas fa-user"></i>
                <input type="email" class="email-input" id="email" placeholder="Email" autocomplete="email" required />
            </div>
            <div class="password">
                <i class="fas fa-lock"></i>
                <input type="password" class="pass-input" id="password" placeholder="Password (min 6 characters)" autocomplete="new-password" required />
            </div>
            <button class="signin-button" id="submit" type="button">sign up</button>
            <div class="link">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" style="color: #888; font-size: 13px; text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> Back to Homepage
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="js/signup.js"></script>
</body>
</html>
